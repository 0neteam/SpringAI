server:
  port: 8080
  servlet:
    session:
      timeout: PT30M  # ISO-8601 포맷 적용
      encoding:
      charset: UTF-8
      enabled: true
      force: true
      
spring:
  application:
    name: ai
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]  # env 파일 형식 개선
  datasource:
    url: jdbc:mariadb://localhost:3306/ai
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# AI SETTING
  ai:
    ollama:
      base-url: http://localhost:11434  # 기본 Ollama 포트 적용
      chat:
        model: llama3.2-vision:11b

# AI_HOST 환경 변수 설정 추가 (선택 사항)
AI_HOST: http://localhost:11434

# file size SETTING
servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# log level SETTING
logging:
  level:
    org:
      springframework:
        web: DEBUG
      thymeleaf: DEBUG